name: Build and Deploy Web Client

on:
  push:
    branches:
      - main

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Install and Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Increment version
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit version changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ./package.json
          git commit -m "Bump web client version to ${{ steps.version.outputs.version }}"
          git pull --rebase origin release/web || echo "Warning: Pull/rebase failed, potential conflicts."
          git push

      - name: Create Git Tag
        run: |
          if git rev-parse "web-v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag web-v${{ steps.version.outputs.version }} already exists"
          else
            git tag "web-v${{ steps.version.outputs.version }}"
            git push origin "web-v${{ steps.version.outputs.version }}"
          fi

      - name: Build Vite app
        env:
          VITE_APP_FIREBASE_VAPID_KEY: ${{ secrets.VITE_APP_FIREBASE_VAPID_KEY }}
          VITE_MESSAGING_API_URL: ${{ secrets.VITE_MESSAGING_API_URL }}
          VITE_MESSAGING_API_TOKEN: ${{ secrets.VITE_MESSAGING_API_TOKEN }}
        run: pnpm run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed - dist directory not found"
            exit 1
          fi
          echo "Build verification passed"
          ls -la dist/
          if [ -f "dist/.htaccess" ]; then
            echo ".htaccess found in dist/"
          else
            echo ".htaccess NOT found in dist/ - cPanel SPA routing may fail"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  cpanel-deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      # CPANEL_HOSTNAME = Shared IP or server hostname (no https://, no :2083)
      # Optional: CPANEL_USE_SFTP=true | CPANEL_FTP_PROTOCOL=ftps|ftp|ftps-legacy | CPANEL_FTP_PORT=21|990
      - name: Resolve cPanel deploy settings
        id: ftp-host
        env:
          CPANEL_HOSTNAME: ${{ secrets.CPANEL_HOSTNAME }}
          CPANEL_FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USE_SFTP: ${{ secrets.CPANEL_USE_SFTP }}
          CPANEL_FTP_PROTOCOL: ${{ secrets.CPANEL_FTP_PROTOCOL }}
          CPANEL_FTP_PORT: ${{ secrets.CPANEL_FTP_PORT }}
        run: |
          HOST="$CPANEL_HOSTNAME"
          if [ -z "$HOST" ]; then HOST="$CPANEL_FTP_SERVER"; fi
          if [ -z "$HOST" ]; then HOST="$CPANEL_HOST"; fi
          if [ -z "$HOST" ]; then
            echo "::error::Missing host secret. Add CPANEL_HOSTNAME (cPanel Shared IP or server hostname)."
            exit 1
          fi

          TRANSPORT="ftp"
          if [ "$CPANEL_USE_SFTP" = "true" ] || [ "$CPANEL_USE_SFTP" = "sftp" ]; then
            TRANSPORT="sftp"
          fi

          PROTOCOL="${CPANEL_FTP_PROTOCOL:-ftps}"
          PORT="${CPANEL_FTP_PORT:-21}"
          if [ "$TRANSPORT" = "sftp" ]; then
            PORT="22"
            PROTOCOL="sftp"
          fi
          if [ "$PROTOCOL" = "ftps-legacy" ] && [ -z "$CPANEL_FTP_PORT" ]; then
            PORT="990"
          fi

          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "transport=$TRANSPORT" >> "$GITHUB_OUTPUT"
          echo "protocol=$PROTOCOL" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          echo "Using transport=$TRANSPORT protocol=$PROTOCOL port=$PORT"

      - name: Deploy to cPanel via SFTP
        if: steps.ftp-host.outputs.transport == 'sftp'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ steps.ftp-host.outputs.host }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: ${{ steps.ftp-host.outputs.port }}
          local_path: './dist/*'
          remote_path: '/public_html/'
          sftp_only: true
          sftpArgs: '-o ConnectTimeout=60'

      - name: Deploy to cPanel via FTP/FTPS
        if: steps.ftp-host.outputs.transport != 'sftp'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ steps.ftp-host.outputs.host }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: ${{ steps.ftp-host.outputs.port }}
          protocol: ${{ steps.ftp-host.outputs.protocol }}
          security: loose
          local-dir: ./dist/
          server-dir: ./public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env*
            cgi-bin/**
          log-level: verbose
          timeout: 300000

      - name: Verify .htaccess deployment
        run: |
          echo "If routing fails after deploy, verify .htaccess in public_html/ and mod_rewrite on the host."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: web-v${{ needs.build.outputs.version }}
          name: Web Release v${{ needs.build.outputs.version }}
          body: |
            Automated web client release for version ${{ needs.build.outputs.version }}

            Deployment details:
            - Version bumped to ${{ needs.build.outputs.version }}
            - Deployed to: https://kinshipsync.com/
            - Build verified and FTP deployment completed successfully

            Verify: https://kinshipsync.com/
          draft: false
          prerelease: false
          generate_release_notes: true

  notify-failure:
    name: Deployment failure notification
    runs-on: ubuntu-latest
    needs:
      - build
      - cpanel-deploy
    if: failure()

    steps:
      - name: Print troubleshooting steps
        run: |
          echo "Web client deploy failed."
          echo ""
          echo "Build job: check Node/pnpm, Vite secrets, and version bump push permissions."
          echo "cPanel job: CPANEL_HOSTNAME, CPANEL_USERNAME, CPANEL_PASSWORD on this repo."
          echo "  Default deploy is FTPS on port 21. If timeout persists, try secrets:"
          echo "    CPANEL_FTP_PROTOCOL=ftps-legacy and CPANEL_FTP_PORT=990"
          echo "    or CPANEL_USE_SFTP=true (port 22; many hosts only allow SFTP from CI)."
          echo "  In cPanel: confirm FTP/SFTP is enabled; check FTP Accounts for the correct port."
          echo ""
          echo "Version (if build succeeded): ${{ needs.build.outputs.version }}"

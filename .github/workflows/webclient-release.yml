name: Build and Deploy Web Client

on:
  push:
    branches:
      - main

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Install and Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Increment version
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit version changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ./package.json
          git commit -m "Bump web client version to ${{ steps.version.outputs.version }}"
          git pull --rebase origin release/web || echo "Warning: Pull/rebase failed, potential conflicts."
          git push

      - name: Create Git Tag
        run: |
          if git rev-parse "web-v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag web-v${{ steps.version.outputs.version }} already exists"
          else
            git tag "web-v${{ steps.version.outputs.version }}"
            git push origin "web-v${{ steps.version.outputs.version }}"
          fi

      - name: Build Vite app
        env:
          VITE_APP_FIREBASE_VAPID_KEY: ${{ secrets.VITE_APP_FIREBASE_VAPID_KEY }}
          VITE_MESSAGING_API_URL: ${{ secrets.VITE_MESSAGING_API_URL }}
          VITE_MESSAGING_API_TOKEN: ${{ secrets.VITE_MESSAGING_API_TOKEN }}
        run: pnpm run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed - dist directory not found"
            exit 1
          fi
          echo "Build verification passed"
          ls -la dist/
          if [ -f "dist/.htaccess" ]; then
            echo ".htaccess found in dist/"
          else
            echo ".htaccess NOT found in dist/ - cPanel SPA routing may fail"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  cpanel-deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: kinshipsync.com
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env*
            cgi-bin/**
          include: |
            **/.htaccess
            .htaccess
          log-level: verbose

      - name: Verify .htaccess deployment
        run: |
          echo "If routing fails after deploy, verify .htaccess in public_html/ and mod_rewrite on the host."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: web-v${{ needs.build.outputs.version }}
          name: Web Release v${{ needs.build.outputs.version }}
          body: |
            Automated web client release for version ${{ needs.build.outputs.version }}

            Deployment details:
            - Version bumped to ${{ needs.build.outputs.version }}
            - Deployed to: https://kinshipsync.com/
            - Build verified and FTP deployment completed successfully

            Verify: https://kinshipsync.com/
          draft: false
          prerelease: false
          generate_release_notes: true

  notify-failure:
    name: Deployment failure notification
    runs-on: ubuntu-latest
    needs:
      - build
      - cpanel-deploy
    if: failure()

    steps:
      - name: Print troubleshooting steps
        run: |
          echo "Web client deploy failed."
          echo ""
          echo "Build job: check Node/pnpm, Vite secrets, and version bump push permissions."
          echo "cPanel job: verify CPANEL_USERNAME and CPANEL_PASSWORD; confirm FTP is enabled."
          echo ""
          echo "Version (if build succeeded): ${{ needs.build.outputs.version }}"
